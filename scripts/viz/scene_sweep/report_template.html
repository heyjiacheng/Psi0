<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the answers down the left (one row per condition, success against the change, every trial as a strip);
   the selected trial's video on the right, kept in view. Distances in cm, in the robot's start frame. */
:root {
  --bg: #f2f3f1; --panel: #fbfbfa; --ink: #12171c; --ink-2: #4a545e; --muted: #858e97; --rule: #e2e4e0; --axis: #c3c7c2;
  --ok: #2a78d6; --ok-soft: #dce8f8; --fail: #d6453e; --fail-soft: #f7e0dd; --ref: rgba(18, 23, 28, 0.06);
  --ref-line: #99a1a9; --table: #e7e2d7; --table-edge: #b3a994; --sel: #12171c; --pending: #d8dbd6;
  --edge-c: #7a6a4f; --faucet-c: #c46a00;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1114; --panel: #161a1e; --ink: #e7eaed; --ink-2: #b2bac2; --muted: #89929b; --rule: #262b30; --axis: #3a4147;
    --ok: #4a92ea; --ok-soft: #1a2c43; --fail: #e8625b; --fail-soft: #3a2221; --ref: rgba(231, 234, 237, 0.07);
    --ref-line: #6c747d; --table: #2a2824; --table-edge: #5a5347; --sel: #e7eaed; --pending: #343a40;
    --edge-c: #bba886; --faucet-c: #f0a33a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1114; --panel: #161a1e; --ink: #e7eaed; --ink-2: #b2bac2; --muted: #89929b; --rule: #262b30; --axis: #3a4147;
  --ok: #4a92ea; --ok-soft: #1a2c43; --fail: #e8625b; --fail-soft: #3a2221; --ref: rgba(231, 234, 237, 0.07);
  --ref-line: #6c747d; --table: #2a2824; --table-edge: #5a5347; --sel: #e7eaed; --pending: #343a40;
  --edge-c: #bba886; --faucet-c: #f0a33a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
.page {
  max-width: 1420px; margin: 0 auto; padding-block: 28px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 450px); gap: 22px 28px;
  grid-template-areas: "head head" "sum view" "map view" "charts view" "strip view" "foot foot"; align-items: start;
}
@media (max-width: 1080px) {
  .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "sum" "map" "view" "charts" "strip" "foot"; }
}
h1, h2, h3 { margin: 0; font-family: var(--cond); font-weight: 600; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.1; letter-spacing: 0.005em; }
h2 { font-size: 13px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.head { grid-area: head; display: grid; gap: 6px; }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.progress { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--ink-2); }
section { min-width: 0; display: grid; gap: 10px; }
.sum { grid-area: sum; }
.charts { grid-area: charts; gap: 22px; }
.strip { grid-area: strip; }
.foot { grid-area: foot; font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }

/* one row per condition */
.rows { display: grid; gap: 2px; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px; }
.srow {
  display: grid; grid-template-columns: 52px minmax(0, 1.3fr) minmax(120px, 2fr) 92px 104px 104px; gap: 14px; align-items: center;
  padding: 7px 8px; border: 0; background: none; text-align: left; border-radius: 4px; cursor: pointer;
}
.srow:hover { background: var(--ref); }
.srow[aria-pressed="true"] { background: var(--ref); box-shadow: inset 2px 0 0 var(--sel); }
.srow .code { font: 500 12px var(--mono); color: var(--muted); }
.srow .name { font-weight: 500; min-width: 0; }
.srow .name small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.track { position: relative; height: 22px; }
.track .bg { position: absolute; left: 0; right: 0; top: 8px; height: 6px; background: var(--ref); border-radius: 3px; }
.track .fill { position: absolute; left: 0; top: 8px; height: 6px; background: var(--ok); border-radius: 0 3px 3px 0; }
.track .ci { position: absolute; top: 10px; height: 2px; background: var(--ink-2); opacity: 0.55; }
.track .ci::before, .track .ci::after { content: ""; position: absolute; top: -4px; width: 1px; height: 10px; background: var(--ink-2); }
.track .ci::before { left: 0; } .track .ci::after { right: 0; }
.track .base { position: absolute; top: 2px; bottom: 2px; width: 0; border-left: 1px solid var(--ref-line); }
.srow .rate { font: 600 17px var(--sans); }
.srow .rate small { font: 400 12px var(--mono); color: var(--muted); margin-left: 5px; }
.srow .delta { font: 12.5px var(--mono); color: var(--ink-2); }
.srow .delta small { display: block; color: var(--muted); font-size: 11.5px; }
@media (max-width: 640px) {
  .srow { grid-template-columns: 40px minmax(0, 1fr) 70px; gap: 4px 10px; }
  .srow .track { grid-column: 2 / 4; grid-row: 2; }
  .srow .delta { grid-column: 2 / 4; grid-row: 3; }
  .srow .delta.st { grid-row: 4; }
}

/* top-down map */
.mapsec { grid-area: map; }
.maphead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.mapcond { font-size: 13px; font-weight: 500; }
.mapcond b { font: 500 12px var(--mono); color: var(--muted); margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-left: auto; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 16px; height: 12px; overflow: visible; }
.mapwrap { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
#map { display: block; width: 100%; }
.ttable { fill: none; stroke-width: 1; stroke-opacity: 0.55; vector-effect: non-scaling-stroke; }
.ttable.ok { stroke: var(--ok); } .ttable.fail { stroke: var(--fail); } .ttable.none { stroke: var(--muted); }
.ppath { fill: none; stroke-width: 1; stroke-opacity: 0.35; vector-effect: non-scaling-stroke; }
.ppath.ok { stroke: var(--ok); } .ppath.fail { stroke: var(--fail); }
.physt { fill: none; stroke: var(--ink-2); stroke-width: 1.3; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.fdot { stroke: var(--panel); stroke-width: 1; vector-effect: non-scaling-stroke; }
.fsel { stroke: var(--sel); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.fdot.ok, .fsel.ok { fill: var(--ok); } .fdot.fail, .fsel.fail { fill: var(--fail); }
.fdot.none, .fsel.none { fill: var(--pending); }
.selring, .hovring { fill: none; stroke: var(--sel); stroke-width: 2; vector-effect: non-scaling-stroke; pointer-events: none; }
.hovring { stroke-width: 1.5; }
#map.picking { cursor: pointer; }
.scalebar { stroke: var(--ink-2); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

/* success against the change */
.group { display: grid; gap: 8px; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
figure.wide { grid-column: 1 / -1; }
.panels.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { .panels.four { grid-template-columns: minmax(0, 1fr); } }
.rowl { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-2); }
.medm { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; }
.ctlm { stroke: var(--ref-line); stroke-width: 2; stroke-linecap: round; }
.guide.se { stroke: var(--edge-c); } .guide.sf { stroke: var(--faucet-c); }
figure { margin: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 10px 4px; display: grid; gap: 2px; min-width: 0; }
figcaption { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 500; }
figcaption .num { font-size: 12px; color: var(--muted); font-weight: 400; }
figure svg { width: 100%; height: auto; display: block; overflow: visible; }
svg text { font-family: var(--mono); fill: var(--muted); font-size: 10.5px; }
svg .lab { font-family: var(--sans); fill: var(--ink-2); font-size: 11.5px; }
.grid { stroke: var(--rule); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.band { fill: var(--ref); }
.refl { stroke: var(--ref-line); stroke-width: 1; }
.guide { stroke: var(--ref-line); stroke-width: 1.2; stroke-dasharray: 3 3; fill: none; }
.rateline { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ratept { fill: var(--ink-2); stroke: var(--panel); stroke-width: 2; }
.dot { cursor: pointer; }
.dot .hit { fill: transparent; }
.dot .m { stroke: var(--panel); stroke-width: 1.2; }
.dot.ok .m { fill: var(--ok); } .dot.fail .m { fill: var(--fail); }
.dot.sel .m { stroke: var(--sel); stroke-width: 2; }
.dot:hover .m { stroke: var(--sel); }
.dot.se .m { fill: var(--edge-c); } .dot.sf .m { fill: var(--faucet-c); }
.dot.still .m { fill: var(--panel); stroke-width: 1.4; } .dot.se.still .m { stroke: var(--edge-c); } .dot.sf.still .m { stroke: var(--faucet-c); }
.dot.ok.still .m { stroke: var(--ok); } .dot.fail.still .m { stroke: var(--fail); }
.sline { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.sline.se { stroke: var(--edge-c); } .sline.sf { stroke: var(--faucet-c); }
figcaption .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 10px; }
figcaption .sw.se { background: var(--edge-c); } figcaption .sw.sf { background: var(--faucet-c); }
figcaption .sw.hol { background: none; box-shadow: inset 0 0 0 1.4px var(--ink-2); }
figcaption .bar { display: inline-block; width: 2.5px; height: 11px; background: var(--ink); margin: 0 4px 0 12px; vertical-align: -1px; }
figcaption .bar.ctl { background: var(--ref-line); }

/* every trial */
.stripwrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px 8px; }
#strip { display: block; }
.cell { cursor: pointer; }
.cell.ok { fill: var(--ok); } .cell.fail { fill: var(--fail); } .cell.none { fill: var(--pending); }
.cell:hover { stroke: var(--sel); stroke-width: 1.5; }
.selbox { fill: none; stroke: var(--sel); stroke-width: 2; pointer-events: none; }
.selcol { fill: var(--ref); pointer-events: none; }
.rowlab { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-2); }

/* the selected trial */
.view {
  grid-area: view; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); display: grid; gap: 10px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px;
  max-height: calc(100vh - 28px); overflow: auto; min-width: 0;
}
@media (max-width: 1080px) { .view { position: static; max-height: none; } }
.vhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.vhead h3 { font-size: 20px; }
.vhead h3 small { font: 400 12px var(--mono); color: var(--muted); margin-left: 8px; }
.nav { display: flex; gap: 4px; }
.nav button { border: 1px solid var(--rule); background: var(--bg); border-radius: 4px; width: 32px; height: 28px; cursor: pointer; }
.nav button:hover { border-color: var(--axis); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid transparent; border-radius: 4px; padding: 2px 8px; font: 500 12px var(--mono); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.fail { background: var(--fail-soft); color: var(--fail); }
.chip.none { background: var(--bg); color: var(--muted); border: 1px dashed var(--rule); }
.chip[aria-pressed="true"] { border: 1px solid var(--sel); }
video, .novid { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; display: block; border-radius: 4px; }
.novid { display: grid; place-items: center; color: #c9ced3; font-size: 13px; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.facts dd.ok { color: var(--ok); } .facts dd.fail { color: var(--fail); }
#sketch { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 4px; }
.tbl { fill: var(--table); stroke: var(--table-edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.faucet { fill: var(--ink); }
.robot { fill: var(--ink-2); fill-opacity: 0.18; stroke: var(--ink-2); stroke-width: 1; vector-effect: non-scaling-stroke; }
.arrow { stroke: var(--ink); stroke-width: 1.5; fill: none; vector-effect: non-scaling-stroke; }
.end { fill: var(--panel); stroke: var(--ink); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.path-r { fill: none; stroke: var(--ok); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.path-l { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.path-p { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 1 3; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.stopm { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.skgrid { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
.tip { position: fixed; z-index: 5; pointer-events: none; background: var(--ink); color: var(--panel); padding: 5px 9px; border-radius: 4px; font-size: 12px; line-height: 1.45; max-width: 300px; }
.tip b { font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="page">
  <header class="head">
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="progress" id="progress" hidden><i></i></div>
  </header>

  <section class="sum" aria-label="Success per condition">
    <div class="rows" id="rows"></div>
  </section>

  <section class="mapsec" aria-label="Top-down map">
    <div class="maphead"><h2>Top-down</h2><span class="mapcond" id="mapcond"></span><div class="legend" id="maplegend"></div></div>
    <div class="mapwrap"><svg id="map" role="img" aria-label="Every trial of the condition from above, by its faucet"></svg></div>
  </section>

  <section class="charts" id="charts" aria-label="Success against the change"></section>

  <section class="strip" aria-label="Every trial">
    <h2>Trials</h2>
    <div class="stripwrap"><svg id="strip" role="img" aria-label="Every trial, one row per condition"></svg></div>
  </section>

  <aside class="view" id="view" aria-live="polite">
    <div class="vhead">
      <h3 id="vtitle">Trial</h3>
      <div class="nav"><button id="prev" aria-label="Previous trial">&larr;</button><button id="next" aria-label="Next trial">&rarr;</button></div>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Condition"></div>
    <div id="video"></div>
    <dl class="facts" id="facts"></dl>
    <svg id="sketch" role="img" aria-label="The scene from above"></svg>
  </aside>

  <footer class="foot" id="foot"></footer>
</div>
<div class="tip" id="tip" hidden></div>

<script id="sweep-data" type="application/json">__DATA_JSON__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("sweep-data").textContent);
  const S = D.sets, T = D.trials, N = D.n_per_set, OUT = D.outcomes;
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const txt = (parent, x, y, s, attrs) => { const t = el("text", Object.assign({ x, y }, attrs || {}), parent); t.textContent = s; return t; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (k, n) => n ? Math.round(100 * k / n) + "%" : "–";
  const at = S.map(() => new Array(N));
  T.forEach(t => { at[t.s][t.i] = t; });
  const ctrlOf = k => S[k].control !== undefined ? S[S[k].control] : null;
  const state = t => !t || !t.done ? "none" : t.success ? "ok" : "fail";
  const mark = t => ({ ok: "✓", fail: "✗", none: "·" })[state(t)];
  const result = t => !t || !t.done ? "not run yet" : (OUT[t.outcome] || t.outcome);
  const bi = S.findIndex(s => s.key === "c0_baseline"), base = bi >= 0 ? S[bi] : null;
  let curI = 0, curS = 0;
  // robot start frame (m: forward, left) -> drawings (cm: x to the robot's right, y backward, so forward is up)
  const X = left => -left * 100, Y = fwd => -fwd * 100;
  const tableCorners = tb => {
    if (tb.poly) return tb.poly.map(([f, l]) => [X(l), Y(f)]);
    const a = (tb.yaw || 0) * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([u, v]) => {
      const lx = u * tb.sx / 2, ly = v * tb.sy / 2;
      return [X(tb.cy + sa * lx + ca * ly), Y(tb.cx + ca * lx - sa * ly)];
    });
  };
  const tablePoly = (tb, cls, parent) => el("polygon", { points: tableCorners(tb).map(p => p.join(",")).join(" "), class: cls }, parent);
  const faucetMark = (parent, t, cls) => {
    const fx = X(t.dy), fy = Y(t.dx);
    return el("rect", { x: fx - 2.8, y: fy - 5.7, width: 5.6, height: 5.7, class: cls, transform: `rotate(${-(t.dyaw || 0)} ${fx} ${fy})` }, parent);
  };
  const robotMark = parent => {
    el("ellipse", { cx: 0, cy: 4.5, rx: 16, ry: 6.5, class: "robot" }, parent);
    el("path", { d: "M0,2 L0,-12 M-3.5,-8 L0,-12.5 L3.5,-8", class: "arrow" }, parent);
  };
  const stopMark = (parent, t, k) => {  // a cross where the robot stopped walking
    const cx = X(t.stop.y), cy = Y(t.stop.x);
    return el("path", { d: `M${cx - k},${cy - k}L${cx + k},${cy + k}M${cx - k},${cy + k}L${cx + k},${cy - k}`, class: "stopm" }, parent);
  };
  const trialMarks = (parent, t, k) => {  // the hands' and the pelvis' paths, and where it stopped walking (or ended)
    const line = (pts, cls) => { if (pts && pts.length > 1) el("polyline", { points: pts.map(([f, l]) => `${X(l)},${Y(f)}`).join(" "), class: cls }, parent); };
    line(t.path_l, "path-l");
    line(t.path_r, "path-r");
    line(t.path_p, "path-p");
    if (t.stop) stopMark(parent, t, k || 3);
    else if (t.end) el("circle", { cx: X(t.end[1]), cy: Y(t.end[0]), r: 3, class: "end" }, parent);
  };

  // ---------- header
  const running = D.done < D.planned;
  document.getElementById("title").textContent = D.title;
  const left = h => h >= 1.5 ? `~${Math.round(h)} h left` : `~${Math.max(1, Math.round(h * 60))} min left`;
  document.getElementById("meta").innerHTML = [D.task, `ckpt ${D.ckpt_step}`,
    running ? `${D.done} / ${D.planned} trials` : `${D.planned} trials`,
    `${D.per_set && D.per_set.length > 1 ? D.per_set[0] + "–" + D.per_set[D.per_set.length - 1] : N} per condition`, D.updated,
    running && D.eta_h ? left(D.eta_h) : null].filter(Boolean).map(s => `<span>${esc(s)}</span>`).join("");
  if (running) {
    const pr = document.getElementById("progress");
    pr.hidden = false;
    pr.firstElementChild.style.width = (100 * D.done / D.planned).toFixed(1) + "%";
  }
  document.getElementById("foot").textContent = D.checkpoint;

  // ---------- tooltip
  const tip = document.getElementById("tip");
  const showTip = (e, lines) => {
    tip.replaceChildren(...lines.map((s, j) => { const d = document.createElement(j ? "div" : "b"); d.textContent = s; return d; }));
    tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, e.clientX + 14)) + "px";

    drawnW = ws;
    dots.length = 0;
    figs.forEach((f, j) => { W = ws[j]; f.svg.replaceChildren(); ({ stand: panelStand, stop: panelStop, lateral: panelStop, overview: panelOverview }[f.P.kind] || panelSuccess)(f.svg, f.P, f.sets); });
    dots.forEach(d => d.classList.toggle("sel", +d.dataset.i === curI && +d.dataset.s === curS));
  };

  // ---------- every trial: one row per condition, one square per trial index
  const strip = document.getElementById("strip");
  const C = 12, G2 = 2, LW = 46, TOP = 16;
  strip.setAttribute("width", LW + N * (C + G2));
  strip.setAttribute("height", TOP + S.length * (C + G2));
  strip.setAttribute("viewBox", `0 0 ${LW + N * (C + G2)} ${TOP + S.length * (C + G2)}`);
  const selcol = el("rect", { y: TOP - 3, width: C + 2 * G2, height: S.length * (C + G2) + 2, rx: 3, class: "selcol" }, strip);
  for (let i = 0; i < N; i += 10) txt(strip, LW + i * (C + G2) + C / 2, 10, String(i), { "text-anchor": "middle" });
  S.forEach((s, k) => {
    txt(strip, 0, TOP + k * (C + G2) + C - 2, s.code, { class: "rowlab" });
    for (let i = 0; i < Math.min(N, s.planned || N); i++) {
      const t = at[k][i];
      const r = el("rect", { x: LW + i * (C + G2), y: TOP + k * (C + G2), width: C, height: C, rx: 2.5, class: "cell " + state(t) }, strip);
      r.dataset.i = i; r.dataset.s = k;
    }
  });
  const selbox = el("rect", { width: C + 2, height: C + 2, rx: 3.5, class: "selbox" }, strip);
  strip.addEventListener("click", e => { const r = e.target.closest(".cell"); if (r) select(+r.dataset.i, +r.dataset.s); });
  strip.addEventListener("pointermove", e => { const r = e.target.closest(".cell"); const t = r && at[+r.dataset.s][+r.dataset.i]; if (!t) { hideTip(); return; } showTip(e, trialTip(t)); });
  strip.addEventListener("pointerleave", hideTip);

  // ---------- top-down map, in the robot's start frame: the selected trial's scene, and every trial of its condition
  // by its faucet (where it was relative to that trial's robot), coloured by the result. The faucet nearest the
  // pointer is picked.
  const map = document.getElementById("map");
  const rec = u => u.table0 || u.table;
  const changed = u => !!u.table0;  // its drawn table differs from the one it was changed from
  const extOf = k => {  // cm; the robot at 0, centred: the condition's faucets, and its tables where they changed
    const ts = at[k].filter(Boolean);
    let half = 45, top = Y(Math.max(...ts.map(u => u.dx))) - 12;
    const deep = top - 130;
    ts.forEach(u => {
      half = Math.max(half, 100 * Math.abs(u.dy) + 25);
      if (changed(u)) tableCorners(u.table).forEach(([x, y]) => { half = Math.max(half, Math.abs(x) + 10); top = Math.min(top, Math.max(deep, y - 8)); });
    });
    return { half: Math.min(half, 330), top, bot: 18 };
  };
  const sw = (fill, stroke, extra) => `<svg viewBox="0 0 16 12" aria-hidden="true"><rect x="1" y="1" width="14" height="10" rx="1.5" fill="${fill}" stroke="${stroke}"${extra || ""}/></svg>`;
  let mapScale = 1, mapDots = [], hover = null;
  const drawMap = () => {
    map.replaceChildren();
    const mapExt = extOf(curS);
    const w = Math.max(260, map.parentNode.clientWidth);
    const spanY = mapExt.bot - mapExt.top;
    const s = Math.max(1.1, Math.min(w / (2 * mapExt.half), Math.min(560, Math.max(320, 0.6 * w)) / spanY));  // px per cm
    const visW = w / s;
    mapScale = s;
    map.setAttribute("viewBox", `${-visW / 2} ${mapExt.top} ${visW} ${spanY}`);
    map.setAttribute("height", Math.round(spanY * s));
    const t = at[curS][curI] || at.map(r => r[curI]).find(Boolean);
    const ts = at[curS].filter(Boolean);
    tablePoly(t.table, "tbl", map);
    if (ts.some(changed)) ts.forEach(u => tablePoly(u.table, "ttable " + state(u), map).style.strokeOpacity = Math.min(0.55, 14 / ts.length).toFixed(3));
    ts.forEach(u => { if (u !== t && u.path_p && u.path_p.length > 1) el("polyline", { points: u.path_p.map(([f, l]) => `${X(l)},${Y(f)}`).join(" "), class: "ppath " + state(u) }, map); });
    if (t.table0 && t.edge_phys !== null) tablePoly(t.table0, "physt", map);  // where the robot would bump into it
    robotMark(map);
    trialMarks(map, t, 3.2);
    mapDots = ts.map(u => ({ u, x: X(u.dy), y: Y(u.dx) }));
    mapDots.forEach(d => { if (d.u !== t) el("circle", { cx: d.x, cy: d.y, r: 6 / s, class: "fdot " + state(d.u) }, map); });
    faucetMark(map, t, "fsel " + state(t));
    el("circle", { cx: X(t.dy), cy: Y(t.dx) - 2.8, r: Math.max(6.5, 11 / s), class: "selring" }, map);
    hover = el("circle", { r: 9 / s, class: "hovring", visibility: "hidden" }, map);
    const bx = -visW / 2 + 14 / s, by = mapExt.bot - 12 / s;
    el("line", { x1: bx, x2: bx + 50, y1: by, y2: by, class: "scalebar" }, map);
    txt(map, bx + 25, by - 6 / s, "50 cm", { "text-anchor": "middle", style: `font-size:${(10.5 / s).toFixed(2)}px` });
    document.getElementById("mapcond").innerHTML = `<b>${esc(S[curS].code)}</b>${esc(S[curS].label)}`;
    document.getElementById("maplegend").innerHTML =
      `<span>${sw("var(--table)", "var(--table-edge)")}table</span>` +
      (t.table0 && t.edge_phys !== null ? `<span><svg viewBox="0 0 16 12" aria-hidden="true"><line x1="1" y1="6" x2="15" y2="6" stroke="var(--ink-2)" stroke-width="1.3" stroke-dasharray="3 2"/></svg>physical table</span>` : "") +
      `<span><svg viewBox="0 0 16 12" aria-hidden="true"><circle cx="4.5" cy="6" r="3.5" fill="var(--ok)"/><circle cx="11.5" cy="6" r="3.5" fill="var(--fail)"/></svg>faucet ✓ ✗</span>` +
      (t.stop ? `<span><svg viewBox="0 0 16 12" aria-hidden="true"><path d="M5,3L11,9M5,9L11,3" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/></svg>stopped walking</span>` : "");
  };
  const pickDot = e => {  // the faucet nearest the pointer, within 26 px
    const m = map.getScreenCTM();
    if (!m || !mapDots.length) return null;
    const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    let best = null, bd = Infinity;
    mapDots.forEach(d => { const dd = Math.hypot(d.x - q.x, d.y - q.y); if (dd < bd) { bd = dd; best = d; } });
    return best && bd * mapScale <= 26 ? best : null;
  };
  map.addEventListener("click", e => { const d = pickDot(e); if (d) select(d.u.i, d.u.s); });
  map.addEventListener("pointermove", e => {
    const d = pickDot(e);
    map.classList.toggle("picking", !!d);
    if (hover) {
      hover.setAttribute("visibility", d ? "visible" : "hidden");
      if (d) { hover.setAttribute("cx", d.x); hover.setAttribute("cy", d.y); }
    }
    if (d) showTip(e, trialTip(d.u)); else hideTip();
  });
  map.addEventListener("pointerleave", () => { hideTip(); map.classList.remove("picking"); if (hover) hover.setAttribute("visibility", "hidden"); });

  // ---------- the selected trial
  const sketch = document.getElementById("sketch");
  const drawSketch = t => {
    sketch.replaceChildren();
    const half = 90, top = -95, bot = 25;
    sketch.setAttribute("viewBox", `${-half} ${top} ${2 * half} ${bot - top}`);
    for (let v = -50; v <= 50; v += 50) el("line", { x1: v, x2: v, y1: top, y2: bot, class: "skgrid" }, sketch);
    for (let v = 0; v >= top; v -= 50) el("line", { x1: -half, x2: half, y1: v, y2: v, class: "skgrid" }, sketch);
    tablePoly(t.table, "tbl", sketch);
    if (t.table0 && t.edge_phys !== null) tablePoly(t.table0, "physt", sketch);
    faucetMark(sketch, t, "faucet");
    robotMark(sketch);
    trialMarks(sketch, t, 3);
  };
  const fact = (k, v, cls) => `<dt>${esc(k)}</dt><dd${cls ? ` class="${cls}"` : ""}>${esc(v)}</dd>`;
  const video = document.getElementById("video");
  function select(i, s) {
    curI = (i + N) % N;
    curS = s === undefined ? curS : s;
    const t = at[curS][curI] || at.map(r => r[curI]).find(Boolean);
    rows.querySelectorAll(".srow").forEach(b => b.setAttribute("aria-pressed", +b.dataset.s === curS));
    dots.forEach(d => d.classList.toggle("sel", +d.dataset.i === curI && +d.dataset.s === curS));
    selcol.setAttribute("x", LW + curI * (C + G2) - G2);
    selbox.setAttribute("x", LW + curI * (C + G2) - 1);
    selbox.setAttribute("y", TOP + curS * (C + G2) - 1);
    document.getElementById("vtitle").innerHTML = `Trial ${curI}<small>${esc(S[curS].code)} ${esc(S[curS].label)}</small>`;
    document.getElementById("chips").innerHTML = S.map((s2, k) => {
      const u = at[k][curI];
      return `<button class="chip ${state(u)}" data-s="${k}" aria-pressed="${k === curS}" title="${esc(s2.label)}: ${esc(result(u))}">${mark(u)} ${esc(s2.code)}</button>`;
    }).join("");
    const src = t && t.video;
    if (src) {
      if (video.dataset.src !== src) {
        video.innerHTML = `<video src="${esc(src)}" controls muted playsinline autoplay preload="metadata"></video>`;
        video.dataset.src = src;
      }
    } else {
      video.innerHTML = `<div class="novid">${t && t.done ? "no video" : "not run yet"}</div>`;
      video.dataset.src = "";
    }
    const st = state(t), sp = t.done && t.stop, cm = v => `${Math.round(100 * v)} cm`;
    document.getElementById("facts").innerHTML =
      fact("Change", t.change) +
      fact("Result", result(t) + (t.done && t.steps ? ` · ${(t.steps / 50).toFixed(1)} s` : ""), st === "none" ? "" : st) +
      (sp ? fact("Stopped walking", sp.set_off_t === null ? "did not walk" : sp.kept_walking ? `never (${cm(sp.walked)} forward at the end)` :
          `at ${sp.t.toFixed(1)} s, ${cm(sp.walked)} forward`) +
        fact("Pelvis to", `table edge ${cm(sp.to_edge)} · faucet ${cm(sp.to_faucet)}` +
          (sp.side !== undefined ? ` (${cm(Math.abs(sp.side))} ${sp.side >= 0 ? "left" : "right"})` : "") +
          (t.edge_phys !== null ? ` · physical edge ${cm(sp.to_physical_edge)}` : "")) +
        (sp.moved_after > 0.03 ? fact("Then moved", cm(sp.moved_after)) : "") : "") +
      (t.done && !t.stop && t.gap !== null ? fact("Pelvis", `${Math.round(t.gap * 100)} cm short of the faucet`) : "") +
      (t.done && t.touch !== null && t.touch !== undefined ? fact("Table contact", t.touch ? `${t.touch} steps` : "none") : "");
    drawSketch(t);
    drawMap();
    if (history.replaceState) history.replaceState(null, "", `#t${curI}s${curS}`);
  }
  document.getElementById("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) select(curI, +b.dataset.s); });
  document.getElementById("prev").addEventListener("click", () => select(curI - 1));
  document.getElementById("next").addEventListener("click", () => select(curI + 1));
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea, video")) return;
    if (e.key === "ArrowLeft") select(curI - 1);
    else if (e.key === "ArrowRight") select(curI + 1);
  });

  // ---------- start at the trial the link names (#t3s2), else the first index finished in most conditions
  drawCharts();
  if (window.ResizeObserver) {
    let queued = false, mapW = 0;
    const ro = new ResizeObserver(() => {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        drawCharts();
        const w = map.parentNode.clientWidth;
        if (w !== mapW) { mapW = w; drawMap(); }
      });
    });
    ro.observe(charts);
    ro.observe(map.parentNode);
  }
  const m = /^#t(\d+)s(\d+)$/.exec(location.hash);
  if (m && +m[1] < N && +m[2] < S.length) select(+m[1], +m[2]);
  else {
    let first = 0, best = -1;
    for (let i = 0; i < N; i++) { const n = S.filter((s, k) => at[k][i] && at[k][i].done).length; if (n > best) { best = n; first = i; } }
    select(first, 0);
  }
})();
</script>
