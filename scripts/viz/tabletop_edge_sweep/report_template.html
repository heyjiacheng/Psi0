<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table Edge Grasp</title>
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e4e1da; --grid: #eeebe5;
  --ok: #2f8f5b; --bad: #c8483c; --base: #7a7873; --edge: #3466b5; --table: #d9d4c9; --sel: #f2b134;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9a93; --line: #34332f; --grid: #2a2926;
    --ok: #52b67f; --bad: #e0675a; --base: #a3a19a; --edge: #6f9be0; --table: #3b3934; --sel: #f2b134;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9c9a93; --line: #34332f; --grid: #2a2926;
  --ok: #52b67f; --bad: #e0675a; --base: #a3a19a; --edge: #6f9be0; --table: #3b3934; --sel: #f2b134;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.panel h2 { font-size: 13.5px; font-weight: 600; margin: 0 0 6px; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-left: 8px; }
.seg button { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; padding: 2px 8px; cursor: pointer; }
.seg button.on { background: var(--grid); color: var(--ink); }
.player { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 8px; margin-top: 12px; }
.vids { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .vids { grid-template-columns: 1fr; } }
.vid { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.vid video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
.vid .cap { font-size: 12px; padding: 4px 2px 0; font-variant-numeric: tabular-nums; }
.vid .cap b { font-weight: 600; }
.strip { margin-top: 12px; }
.row { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 6px; align-items: center; padding: 2px 0; }
.row .x { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; cursor: pointer;
        background: var(--panel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.chip.ok { border-left: 4px solid var(--ok); } .chip.bad { border-left: 4px solid var(--bad); }
.chip.sel { outline: 2px solid var(--sel); }
.head { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Table edge · tabletop grasp</h1>
  <div class="sub" id="sub"></div>
  <div class="tiles" id="tiles"></div>
  <div class="grid2">
    <div class="panel">
      <h2>Top-down, robot frame <span class="seg" id="mapseg"><button data-v="all" class="on">both</button><button data-v="c0_baseline">baseline</button><button data-v="e1_edge_x">edge moved</button></span></h2>
      <svg id="map" viewBox="0 0 520 470" role="img" aria-label="top-down map of drawn table edges and cans"></svg>
      <div class="legend"><span><i style="background:var(--ok)"></i>lifted</span><span><i style="background:var(--bad)"></i>not lifted</span><span>line = drawn near edge · dot = can</span></div>
    </div>
    <div class="panel">
      <h2 id="reachtitle">Same scene: right hand 1.2 s in, edge moved minus baseline</h2>
      <svg id="reach" viewBox="0 0 520 470" role="img" aria-label="reach error against edge shift"></svg>
      <div class="legend"><span><i style="background:var(--ok)"></i>lifted</span><span><i style="border:1.5px solid var(--bad)"></i>not lifted</span><span id="slope"></span></div>
    </div>
  </div>
  <div class="player">
    <div class="vids">
      <div class="vid"><video id="v0" controls muted playsinline preload="metadata"></video><div class="cap" id="c0"></div></div>
      <div class="vid"><video id="v1" controls muted playsinline preload="metadata"></video><div class="cap" id="c1"></div></div>
    </div>
  </div>
  <div class="strip panel">
    <div class="row head"><div class="x">edge, cm</div><div>baseline</div><div>edge moved</div></div>
    <div id="rows"></div>
  </div>
  <div class="note" id="note"></div>
</main>
<script>
const D = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const pct = (k, n) => n ? Math.round(100 * k / n) + "%" : "–";
const cm = (m, d = 1) => (m == null ? "–" : (m * 100).toFixed(d));
const sgn = (m, d = 1) => (m == null ? "–" : (m >= 0 ? "+" : "−") + Math.abs(m * 100).toFixed(d));
const T = D.trials;
const byIdx = {};
for (const r of T) { (byIdx[r.index] = byIdx[r.index] || {})[r.set] = r; }
let sel = null, mapSet = "all";

const S = D.summary, P = D.pairs, st = D.settings;
$("sub").textContent = `${st.task} · ${(st.run_dir || "").split("/").pop()} · ${D.n_done}/${D.n_planned} trials · edge ${sgn(-st.farther, 0)}…${sgn(st.closer, 0)} cm (+ = toward the robot) · physics unchanged`;
const tile = (k, v, s) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
const fmt = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2);
for (const r of T) r.hx = r.hand ? r.hand.minus_can_x : null;
let tiles = "";
for (const s of st.sets) {
  const x = S[s]; if (!x) continue;
  tiles += tile(s === "c0_baseline" ? "baseline: lifted" : "edge moved: lifted", `${x.k}/${x.n}`, `${pct(x.k, x.n)} · 95% ${Math.round(100 * x.ci[0])}–${Math.round(100 * x.ci[1])}%`);
}
if (P) {
  tiles += tile("same scene, one lifted", `${P.only_c0} · ${P.only_e1}`, `baseline only · edge only · McNemar p ${P.p.toFixed(3)}`);
  const rs = P.hand_follow_edge;
  if (rs) tiles += tile("hand follows the edge, cm per cm", fmt(rs.slope), `95% ${rs.ci[0].toFixed(2)} … ${rs.ci[1].toFixed(2)} · same scene · 1 = edge`);
}
if (D.can_follow) {
  const c = D.can_follow, dm = D.demo_follow;
  tiles += tile("hand follows the can, cm per cm", fmt(c.slope) + (dm ? ` <span style="font-size:15px;color:var(--muted)">demos ${fmt(dm.slope)}</span>` : ""), `95% ${c.ci[0].toFixed(2)} … ${c.ci[1].toFixed(2)} · can depth across scenes`);
}
$("tiles").innerHTML = tiles;

// ---------------------------------------------------------------- map (robot start frame: x forward = up, y left = left)
function drawMap() {
  const svg = $("map"); svg.innerHTML = "";
  const W = 520, H = 470, m = { l: 36, r: 12, t: 10, b: 28 };
  const X0 = -0.12, X1 = 0.62, Y0 = -0.42, Y1 = 0.42;  // m
  const sc = Math.min((W - m.l - m.r) / (Y1 - Y0), (H - m.t - m.b) / (X1 - X0));
  const px = (y) => m.l + (Y1 - y) * sc, py = (x) => m.t + (X1 - x) * sc;
  for (let x = -0.1; x <= 0.6001; x += 0.1) {
    el("line", { x1: px(Y1), x2: px(Y0), y1: py(x), y2: py(x), stroke: "var(--grid)" }, svg);
    el("text", { x: m.l - 6, y: py(x) + 4, "text-anchor": "end" }, svg).textContent = Math.round(x * 100);
  }
  for (let y = -0.4; y <= 0.4001; y += 0.2) el("text", { x: px(y), y: H - 10, "text-anchor": "middle" }, svg).textContent = Math.round(y * 100);
  el("text", { x: 4, y: 12 }, svg).textContent = "cm";
  // the training range of the visible edge
  if (D.train) {
    const e = D.train.edge_from_robot;
    el("rect", { x: px(Y1), y: py(e[1]), width: px(Y0) - px(Y1), height: py(e[0]) - py(e[1]), fill: "var(--table)", opacity: 0.45 }, svg);
  }
  const show = T.filter(r => mapSet === "all" || r.set === mapSet);
  for (const r of show) {
    const g = r.geom, x = g.edge_from_robot;
    const yl = g.counter.y[1] - g.robot[1], yr = g.counter.y[0] - g.robot[1];
    const col = r.success ? "var(--ok)" : "var(--bad)";
    const isSel = sel === r.index;
    el("line", { x1: px(Math.min(yl, Y1)), x2: px(Math.max(yr, Y0)), y1: py(x), y2: py(x), stroke: isSel ? "var(--sel)" : col,
      "stroke-width": isSel ? 3 : 1.2, opacity: isSel ? 1 : (r.set === "c0_baseline" ? 0.35 : 0.6),
      "stroke-dasharray": r.set === "c0_baseline" ? "4 3" : null }, svg);
  }
  for (const r of show) {
    const t = r.geom.target, col = r.success ? "var(--ok)" : "var(--bad)";
    const c = el("circle", { cx: px(t[1]), cy: py(t[0]), r: sel === r.index ? 7 : 5, fill: col, "fill-opacity": r.set === "c0_baseline" ? 0.35 : 0.75,
      stroke: sel === r.index ? "var(--sel)" : "none", "stroke-width": 2.5, style: "cursor:pointer" }, svg);
    c.addEventListener("click", () => select(r.index));
    el("title", {}, c).textContent = `${r.label} ${r.set} edge ${sgn(r.value.edge_closer)} cm · ${r.outcome}`;
  }
  // robot
  el("circle", { cx: px(0), cy: py(0), r: 9, fill: "none", stroke: "var(--ink)", "stroke-width": 1.5 }, svg);
  el("path", { d: `M${px(0)},${py(0.06)} l-5,9 l10,0 z`, fill: "var(--ink)" }, svg);
}
document.querySelectorAll("#mapseg button").forEach(b => b.addEventListener("click", () => {
  mapSet = b.dataset.v; document.querySelectorAll("#mapseg button").forEach(x => x.classList.toggle("on", x === b)); drawMap();
}));

// ---------------------------------------------------------------- reach against the edge shift
function drawReach() {
  const svg = $("reach"); svg.innerHTML = "";
  const W = 520, H = 470, m = { l: 40, r: 12, t: 12, b: 34 };
  const xs = [-(st.farther + 0.01), st.closer + 0.01];
  const pts = [];  // same scene: the edge-moved trial's hand minus its baseline trial's, against the edge shift
  for (const i in byIdx) {
    const a = byIdx[i].c0_baseline, e = byIdx[i].e1_edge_x;
    if (a && e && a.hand && e.hand) pts.push({ r: e, x: e.value.edge_closer, y: e.hand.x - a.hand.x, i: +i });
  }
  const vals = pts.map(p => p.y);
  let y0 = Math.min(-st.closer - 0.01, ...vals) - 0.01, y1 = Math.max(st.farther + 0.01, ...vals) + 0.01;
  const px = (x) => m.l + (x - xs[0]) / (xs[1] - xs[0]) * (W - m.l - m.r);
  const py = (y) => m.t + (y1 - y) / (y1 - y0) * (H - m.t - m.b);
  for (let y = Math.ceil(y0 * 20) / 20; y <= y1; y += 0.05) {
    el("line", { x1: px(xs[0]), x2: px(xs[1]), y1: py(y), y2: py(y), stroke: "var(--grid)" }, svg);
    el("text", { x: m.l - 6, y: py(y) + 4, "text-anchor": "end" }, svg).textContent = Math.round(y * 100);
  }
  for (let x = Math.ceil(xs[0] * 20) / 20; x <= xs[1]; x += 0.05) {
    el("line", { x1: px(x), x2: px(x), y1: py(y0), y2: py(y1), stroke: "var(--grid)" }, svg);
    el("text", { x: px(x), y: H - 18, "text-anchor": "middle" }, svg).textContent = Math.round(x * 100);
  }
  el("text", { x: (W + m.l) / 2, y: H - 4, "text-anchor": "middle" }, svg).textContent = "edge drawn closer, cm (− farther)";
  el("text", { x: 4, y: 12 }, svg).textContent = "cm";
  el("line", { x1: px(xs[0]), x2: px(xs[1]), y1: py(0), y2: py(0), stroke: "var(--base)", "stroke-dasharray": "4 3" }, svg);
  // following the edge: the hand 1 cm nearer the robot per cm the edge comes closer
  el("line", { x1: px(xs[0]), x2: px(xs[1]), y1: py(-xs[0]), y2: py(-xs[1]), stroke: "var(--muted)", "stroke-width": 1.2, "stroke-dasharray": "1 3" }, svg);
  for (const p of pts) {
    const isSel = sel === p.i, r = p.r;
    const c = el("circle", { cx: px(p.x), cy: py(p.y), r: isSel ? 6.5 : 4.5, fill: r.success ? "var(--ok)" : "none",
      stroke: isSel ? "var(--sel)" : (r.success ? "none" : "var(--bad)"), "stroke-width": isSel ? 2.5 : 1.5, style: "cursor:pointer" }, svg);
    c.addEventListener("click", () => select(p.i));
    el("title", {}, c).textContent = `${r.label} edge ${sgn(p.x)} cm · hand ${sgn(p.y)} cm vs its baseline · ${r.outcome}`;
  }
  if (pts.length > 2) {
    const n = pts.length, mx = pts.reduce((a, p) => a + p.x, 0) / n, my = pts.reduce((a, p) => a + p.y, 0) / n;
    const sxx = pts.reduce((a, p) => a + (p.x - mx) ** 2, 0), sxy = pts.reduce((a, p) => a + (p.x - mx) * (p.y - my), 0);
    const b = sxx > 0 ? sxy / sxx : 0;
    el("line", { x1: px(xs[0]), x2: px(xs[1]), y1: py(my + b * (xs[0] - mx)), y2: py(my + b * (xs[1] - mx)), stroke: "var(--edge)", "stroke-width": 2 }, svg);
    $("slope").innerHTML = `<span style="color:var(--edge)">━</span> fit · dashed = unchanged · dotted = following the edge · colour = edge-moved trial`;
  }
}

// ---------------------------------------------------------------- videos and the trial list
function cap(r) {
  if (!r) return "–";
  const lift = `lifted ${cm(r.max_lift)} cm`;
  return `<b style="color:${r.success ? "var(--ok)" : "var(--bad)"}">${r.success ? "success" : r.outcome.replace("_", " ")}</b> · ${r.set === "c0_baseline" ? "baseline" : "edge " + sgn(r.value.edge_closer) + " cm"} · ${lift} · hand − can ${sgn(r.hx)} cm · ${r.label}`;
}
function select(i) {
  sel = i;
  const p = byIdx[i] || {};
  const a = p.c0_baseline, b = p.e1_edge_x;
  [[a, "v0", "c0"], [b, "v1", "c1"]].forEach(([r, v, c]) => {
    const vid = $(v);
    if (r && r.video) { vid.src = r.video; if (r.frame) vid.poster = r.frame; vid.play().catch(() => {}); }
    else { vid.removeAttribute("src"); vid.removeAttribute("poster"); vid.load(); }
    $(c).innerHTML = cap(r);
  });
  document.querySelectorAll(".chip").forEach(ch => ch.classList.toggle("sel", +ch.dataset.i === i));
  drawMap(); drawReach();
}
function drawRows() {
  const idx = Object.keys(byIdx).map(Number);
  const shift = (i) => (byIdx[i].e1_edge_x ? byIdx[i].e1_edge_x.value.edge_closer : 0);
  idx.sort((a, b) => shift(b) - shift(a));
  const chip = (r, i) => r ? `<div class="chip ${r.success ? "ok" : "bad"}" data-i="${i}">${r.success ? "lifted" : r.outcome.replace("_", " ")} · ${cm(r.max_lift)} cm · ${r.label}</div>` : `<div></div>`;
  $("rows").innerHTML = idx.map(i => `<div class="row"><div class="x">${byIdx[i].e1_edge_x ? sgn(shift(i)) : ""}</div>${chip(byIdx[i].c0_baseline, i)}${chip(byIdx[i].e1_edge_x, i)}</div>`).join("");
  document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => select(+ch.dataset.i)));
}
drawRows(); drawMap(); drawReach();
const first = Object.keys(byIdx).map(Number).sort((a, b) => a - b)[0];
if (first != null) select(first);
if (P && P.bins) $("note").textContent = "lifted by edge shift (edge moved vs its baseline trials): " + P.bins.filter(b => b.n).map(b => `${sgn(b.lo, 0)}…${sgn(b.hi, 0)} cm ${b.e1}/${b.n} vs ${b.c0}/${b.n}`).join(" · ");
</script>
</body>
</html>
